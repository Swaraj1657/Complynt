<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details — Complynt</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Shell Bar injected by common.js -->
    <div id="shell-bar"></div>

    <!-- Left Nav injected by common.js -->
    <nav id="left-nav-container"></nav>

    <!-- Main Content -->
    <main class="app-layout" id="main-content" style="padding: 0;">
        <!-- Loading State -->
        <div id="loading-state" class="loading" style="min-height: 400px;">
            <div class="spinner"></div>
            Loading complaint details...
        </div>

        <!-- Error State -->
        <div id="error-state" class="card" style="display: none; margin: 24px;">
            <div class="card-body">
                <div class="empty-state">
                    <p class="empty-text" id="error-message">Error loading complaint</p>
                    <button class="btn btn-primary mt-16" onclick="loadComplaint()">Retry</button>
                </div>
            </div>
        </div>

        <!-- Complaint Content (hidden until loaded) -->
        <div id="complaint-content" style="display: none;">
            <!-- Object Header -->
            <div class="object-header">
                <a href="/complaints.html" class="object-header__back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    Back to Complaints
                </a>
                <div class="object-header__row">
                    <div>
                        <div class="object-header__id" id="header-ticket"></div>
                        <div class="object-header__title" id="header-title"></div>
                        <div class="object-header__badges" id="header-badges"></div>
                    </div>
                    <div class="object-header__actions">
                        <button class="btn btn-danger" onclick="escalateComplaint()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/>
                                <line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                            Escalate
                        </button>
                        <button class="btn btn-primary" onclick="openDrawer('action-drawer')">
                            Manage
                        </button>
                    </div>
                </div>
                <div class="object-header__attrs" id="header-attrs"></div>
            </div>

            <!-- SLA Bar -->
            <div class="sla-bar-wrap" id="sla-bar"></div>

            <!-- Tab Strip -->
            <div class="tab-strip" id="tab-strip">
                <button class="tab-btn active" data-tab="details" onclick="switchTab('details')">Details</button>
                <button class="tab-btn" data-tab="communication" onclick="switchTab('communication')">Communication</button>
                <button class="tab-btn" data-tab="sla" onclick="switchTab('sla')">SLA History</button>
                <button class="tab-btn" data-tab="customer" onclick="switchTab('customer')">Customer 360</button>
            </div>

            <!-- Tab Content -->
            <div style="padding: 24px;">
                <!-- Details Tab -->
                <div class="tab-content active" id="tab-details">
                    <div class="grid-2">
                        <div class="card">
                            <div class="card-header"><h3>Description</h3></div>
                            <div class="card-body">
                                <p id="complaint-description" style="white-space: pre-wrap; line-height: 1.7;"></p>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <h3>AI Classification</h3>
                                <button class="btn btn-sm btn-secondary" onclick="runAiClassification()">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="23 4 23 10 17 10"/>
                                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                                    </svg>
                                    Run Analysis
                                </button>
                            </div>
                            <div class="card-body" id="ai-classification">
                                <div class="empty-state" style="padding: 30px;">
                                    <p class="empty-text">AI analysis pending</p>
                                    <p class="empty-sub">Click "Run Analysis" to classify this complaint</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Communication Tab -->
                <div class="tab-content" id="tab-communication">
                    <div class="card">
                        <div class="card-header"><h3>Timeline</h3></div>
                        <div class="card-body">
                            <div class="timeline" id="timeline"></div>
                            
                            <!-- Add Comment Form -->
                            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-border-light);">
                                <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">Add Reply</h4>
                                <div class="form-group">
                                    <textarea id="reply-text" class="form-control" rows="3" placeholder="Type your message here..."></textarea>
                                </div>
                                <div class="flex-between">
                                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
                                        <input type="checkbox" id="reply-internal">
                                        Internal Note Only
                                    </label>
                                    <button class="btn btn-primary" onclick="addReply()">Send Reply</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SLA Tab -->
                <div class="tab-content" id="tab-sla">
                    <div class="card">
                        <div class="card-header"><h3>SLA Information</h3></div>
                        <div class="card-body">
                            <ul class="info-list" id="sla-info"></ul>
                        </div>
                    </div>
                </div>

                <!-- Customer Tab -->
                <div class="tab-content" id="tab-customer">
                    <div class="grid-7-3">
                        <div class="card">
                            <div class="card-header"><h3>Customer Profile</h3></div>
                            <div class="card-body" id="customer-profile"></div>
                        </div>
                        <div class="card">
                            <div class="card-header"><h3>Quick Stats</h3></div>
                            <div class="card-body" id="customer-stats"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Action Drawer -->
    <div class="drawer-overlay" id="action-drawer-overlay" onclick="closeDrawer('action-drawer')"></div>
    <div class="drawer" id="action-drawer">
        <div class="drawer-header">
            <span class="drawer-header__title">Manage Complaint</span>
            <button class="drawer-close" onclick="closeDrawer('action-drawer')">&times;</button>
        </div>
        <div class="drawer-body">
            <!-- Change Status -->
            <div class="form-group">
                <label>Change Status</label>
                <select id="new-status" class="form-control">
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="ESCALATED">Escalated</option>
                    <option value="CLOSED">Closed</option>
                </select>
            </div>
            <div class="form-group">
                <label>Internal Note (Optional)</label>
                <textarea id="status-note" class="form-control" rows="3" placeholder="Add a note about this status change..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="updateStatus()" style="width: 100%;">Update Status</button>

            <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--color-border-light);">

            <!-- Reassign Agent -->
            <div class="form-group">
                <label>Reassign Agent</label>
                <select id="new-agent" class="form-control">
                    <option value="">Select Agent...</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="reassignAgent()" style="width: 100%;">Reassign</button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // Initialize layout
        initLayout('complaints');

        // Get complaint ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const complaintId = urlParams.get('id');
        let complaint = null;
        let currentTab = 'details';

        async function loadComplaint() {
            if (!complaintId) {
                showError('No complaint ID provided');
                return;
            }

            document.getElementById('loading-state').style.display = 'flex';
            document.getElementById('error-state').style.display = 'none';
            document.getElementById('complaint-content').style.display = 'none';

            try {
                complaint = await getComplaintById(complaintId);
                renderComplaint();
                loadAgentsDropdown();
                
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('complaint-content').style.display = 'block';
            } catch (err) {
                showError(err.message);
            }
        }

        function showError(message) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-state').style.display = 'block';
        }

        function renderComplaint() {
            if (!complaint) return;

            // Header
            document.getElementById('header-ticket').innerHTML = `
                ${complaint.ticketNumber || 'N/A'}
            `;
            document.getElementById('header-title').textContent = complaint.title || '';
            document.getElementById('header-badges').innerHTML = `
                ${severityBadge(complaint.severity)}
                ${statusBadge(complaint.status)}
            `;

            // Attributes
            document.getElementById('header-attrs').innerHTML = `
                <div class="object-attr">
                    <div class="object-attr__label">Product</div>
                    <div class="object-attr__value">${productLabel(complaint.productType)}</div>
                </div>
                <div class="object-attr">
                    <div class="object-attr__label">Channel</div>
                    <div class="object-attr__value">${complaint.channel || '\u2014'}</div>
                </div>
                <div class="object-attr">
                    <div class="object-attr__label">Assigned To</div>
                    <div class="object-attr__value">${complaint.assignedAgent ? complaint.assignedAgent.name : '<span style="color: var(--color-text-light)">Unassigned</span>'}</div>
                </div>
                <div class="object-attr">
                    <div class="object-attr__label">Created</div>
                    <div class="object-attr__value">${formatDate(complaint.createdAt)}</div>
                </div>
            `;

            // SLA Bar
            renderSlaBar();

            // Description
            document.getElementById('complaint-description').textContent = complaint.description || 'No description provided.';

            // AI Classification
            renderAiClassification();

            // Timeline
            renderTimeline();

            // SLA Info
            renderSlaInfo();

            // Customer Profile
            renderCustomerProfile();

            // Update status dropdown
            document.getElementById('new-status').value = complaint.status || 'OPEN';

            // Update page title
            document.title = `${complaint.ticketNumber} — Complynt`;
        }

        function renderSlaBar() {
            const slaBar = document.getElementById('sla-bar');
            const sla = complaint.slaStatus;

            if (!sla || !complaint.slaDeadline) {
                slaBar.innerHTML = `
                    <span class="sla-bar-label">SLA Status</span>
                    <span style="color: var(--color-text-muted);">No SLA configured</span>
                `;
                return;
            }

            const pct = sla.elapsedPercent || 0;
            const colorClass = pct > 100 ? 'red' : (pct > 75 ? 'orange' : 'green');
            const deadline = new Date(complaint.slaDeadline);
            const now = new Date();
            const remaining = deadline - now;

            slaBar.innerHTML = `
                <span class="sla-bar-label">${slaBadge(sla)}</span>
                <div class="sla-bar-track">
                    <div class="sla-bar-fill ${colorClass}" style="width: ${Math.min(pct, 100)}%;"></div>
                </div>
                <span class="sla-bar-time">${remaining > 0 ? formatCountdown(remaining) : 'Overdue'}</span>
            `;
        }

        function renderAiClassification() {
            const container = document.getElementById('ai-classification');

            if (!complaint.sentimentLabel && !complaint.aiSuggestedResponse) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 30px;">
                        <p class="empty-text">AI analysis pending</p>
                        <p class="empty-sub">Click "Run Analysis" to classify this complaint</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <ul class="info-list">
                    <li class="info-row">
                        <span class="info-label">Sentiment</span>
                        <span class="info-value">${complaint.sentimentLabel ? `<span class="badge badge-${complaint.sentimentLabel.toLowerCase()}">${complaint.sentimentLabel}</span>` : '\u2014'}</span>
                    </li>
                </ul>
                ${complaint.aiSuggestedResponse ? `
                    <div style="margin-top: 16px; padding: 14px; background: var(--color-success-bg); border-radius: var(--radius-sm); border-left: 3px solid var(--color-success);">
                        <div style="font-size: 11px; font-weight: 600; color: var(--color-success); margin-bottom: 6px;">AI SUGGESTED RESPONSE</div>
                        <p style="font-size: 13px; line-height: 1.6;">${complaint.aiSuggestedResponse}</p>
                    </div>
                ` : ''}
            `;
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            const comments = complaint.comments || [];

            if (!comments.length) {
                timeline.innerHTML = '<p style="color: var(--color-text-muted); padding: 20px 0;">No communication history yet.</p>';
                return;
            }

            timeline.innerHTML = comments.map(cm => `
                <div class="timeline-item">
                    <div class="timeline-avatar">${getInitials(cm.authorName)}</div>
                    <div class="timeline-content ${cm.isInternal ? 'internal' : 'external'}">
                        <div class="timeline-meta">
                            <div>
                                <span class="timeline-actor">${cm.authorName}</span>
                                <span class="timeline-role">${cm.authorRole || ''}</span>
                                ${cm.isInternal ? '<span class="badge badge-sm badge-internal" style="margin-left: 8px;">Internal</span>' : ''}
                            </div>
                            <span class="timeline-time">${timeAgo(cm.createdAt)}</span>
                        </div>
                        <div class="timeline-text">${cm.content}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderSlaInfo() {
            const slaInfo = document.getElementById('sla-info');
            const sla = complaint.slaStatus;

            slaInfo.innerHTML = `
                <li class="info-row">
                    <span class="info-label">Created At</span>
                    <span class="info-value">${formatDate(complaint.createdAt)}</span>
                </li>
                <li class="info-row">
                    <span class="info-label">Target Resolution</span>
                    <span class="info-value font-bold">${complaint.slaDeadline ? formatDate(complaint.slaDeadline) : '\u2014'}</span>
                </li>
                <li class="info-row">
                    <span class="info-label">Current Status</span>
                    <span class="info-value">${slaBadge(sla)}</span>
                </li>
                <li class="info-row">
                    <span class="info-label">Time Elapsed</span>
                    <span class="info-value mono">${sla ? Math.round(sla.elapsedPercent || 0) + '%' : '\u2014'}</span>
                </li>
            `;
        }

        function renderCustomerProfile() {
            const profile = document.getElementById('customer-profile');
            const stats = document.getElementById('customer-stats');
            const cust = complaint.customer;

            if (!cust) {
                profile.innerHTML = '<p style="color: var(--color-text-muted);">No customer information available.</p>';
                stats.innerHTML = '';
                return;
            }

            profile.innerHTML = `
                <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                    <div class="agent-avatar" style="width: 64px; height: 64px; font-size: 22px;">${getInitials(cust.fullName)}</div>
                    <div>
                        <div style="font-size: 18px; font-weight: 600;">${cust.fullName}</div>
                        <div style="font-size: 13px; color: var(--color-text-muted);">${cust.customerNumber || ''}</div>
                    </div>
                </div>
                <ul class="info-list">
                    <li class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">${cust.email || '\u2014'}</span>
                    </li>
                    <li class="info-row">
                        <span class="info-label">Phone</span>
                        <span class="info-value">${cust.phone || '\u2014'}</span>
                    </li>
                    <li class="info-row">
                        <span class="info-label">Account #</span>
                        <span class="info-value mono">${cust.accountNumber || '\u2014'}</span>
                    </li>
                </ul>
                <a href="/customers.html" class="btn btn-secondary" style="width: 100%; margin-top: 16px;">View Full Profile</a>
            `;

            stats.innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <div style="font-family: var(--font-mono); font-size: 32px; font-weight: 600; color: var(--color-primary);">1</div>
                    <div style="font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Current Complaint</div>
                </div>
            `;
        }

        function switchTab(tabName) {
            currentTab = tabName;

            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.id === 'tab-' + tabName);
            });
        }

        async function loadAgentsDropdown() {
            const select = document.getElementById('new-agent');
            try {
                const agents = await getAgents();
                select.innerHTML = '<option value="">Select Agent...</option>' + 
                    agents.map(a => `<option value="${a.id}" ${complaint.assignedAgent && complaint.assignedAgent.id === a.id ? 'selected' : ''}>${a.name} (${a.role})</option>`).join('');
            } catch (err) {
                select.innerHTML = '<option value="">Error loading agents</option>';
            }
        }

        async function updateStatus() {
            const status = document.getElementById('new-status').value;
            const note = document.getElementById('status-note').value;

            try {
                complaint = await updateComplaintStatus(complaintId, status, note);
                showToast('Status updated successfully', 'success');
                closeDrawer('action-drawer');
                renderComplaint();
            } catch (err) {
                showToast('Failed to update status: ' + err.message, 'error');
            }
        }

        async function reassignAgent() {
            const agentId = document.getElementById('new-agent').value;
            if (!agentId) {
                showToast('Please select an agent', 'warning');
                return;
            }

            try {
                complaint = await reassignComplaint(complaintId, agentId);
                showToast('Agent reassigned successfully', 'success');
                closeDrawer('action-drawer');
                renderComplaint();
            } catch (err) {
                showToast('Failed to reassign agent: ' + err.message, 'error');
            }
        }

        async function escalateComplaint() {
            if (complaint.status === 'ESCALATED') {
                showToast('This complaint is already escalated', 'warning');
                return;
            }

            if (!confirm('Are you sure you want to escalate this complaint to a supervisor?')) {
                return;
            }

            try {
                complaint = await updateComplaintStatus(complaintId, 'ESCALATED', 'Escalated by supervisor');
                showToast('Complaint escalated successfully', 'success');
                renderComplaint();
            } catch (err) {
                showToast('Failed to escalate: ' + err.message, 'error');
            }
        }

        async function addReply() {
            const text = document.getElementById('reply-text').value.trim();
            const isInternal = document.getElementById('reply-internal').checked;

            if (!text) {
                showToast('Please enter a message', 'warning');
                return;
            }

            try {
                await addComment(complaintId, text, 'Admin User', 'SUPERVISOR', isInternal);
                document.getElementById('reply-text').value = '';
                document.getElementById('reply-internal').checked = false;
                
                // Reload complaint to get updated comments
                complaint = await getComplaintById(complaintId);
                renderTimeline();
                showToast('Reply added successfully', 'success');
            } catch (err) {
                showToast('Failed to add reply: ' + err.message, 'error');
            }
        }

        async function runAiClassification() {
            showToast('Running AI analysis...', 'info');
            try {
                complaint = await classifyComplaint(complaintId);
                showToast('AI analysis complete', 'success');
                renderAiClassification();
            } catch (err) {
                showToast('AI analysis failed: ' + err.message, 'error');
            }
        }

        // Initial load
        loadComplaint();
    </script>
</body>
</html>
