<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details — ComplaintHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
    <div class="page-body" id="detail-body">
        <div class="loading"><div class="spinner"></div>Loading complaint...</div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
initLayout('complaints');
const urlParams = new URLSearchParams(window.location.search);
const compId = urlParams.get('id');
let complaint = null;
let currentTab = 'details';

async function loadDetail() {
    if (!compId) { document.getElementById('detail-body').innerHTML = '<div class="empty-state"><p>No complaint ID provided.</p></div>'; return; }
    try {
        complaint = await api.getComplaint(compId);
        render();
    } catch(err) {
        document.getElementById('detail-body').innerHTML = '<div class="empty-state"><p>Error: '+err.message+'</p></div>';
    }
}

function render() {
    const el = document.getElementById('detail-body');
    if (!complaint) return;
    const c = complaint;
    
    let tabsHtml = 
        '<div class="tab-bar">' +
            '<div class="tab ' + (currentTab==='details'?'active':'') + '" onclick="switchTab(\'details\')">General Info</div>' +
            '<div class="tab ' + (currentTab==='actions'?'active':'') + '" onclick="switchTab(\'actions\')">Actions & Status</div>' +
            '<div class="tab ' + (currentTab==='communication'?'active':'') + '" onclick="switchTab(\'communication\')">Communication ('+(c.comments?c.comments.length:0)+')</div>' +
            '<div class="tab ' + (currentTab==='sla'?'active':'') + '" onclick="switchTab(\'sla\')">SLA Tracking</div>' +
            '<div class="tab ' + (currentTab==='customer'?'active':'') + '" onclick="switchTab(\'customer\')">Customer 360</div>' +
        '</div>';

    let contentHtml = '';
    if (currentTab === 'details') {
        contentHtml = 
        '<div class="grid-2">' +
            '<div class="card"><div class="card-header"><h3>Description</h3></div><div class="card-body"><p style="white-space:pre-wrap;line-height:1.6;color:var(--text);">'+c.description+'</p></div></div>' +
            '<div class="card"><div class="card-header"><h3>AI Classification</h3></div><div class="card-body">' +
                '<p><strong>Sentiment:</strong> '+(c.sentimentLabel ? '<span class="badge badge-'+c.sentimentLabel.toLowerCase()+'">'+c.sentimentLabel+'</span>' : '<span style="color:var(--text-light)">Pending</span>') + '</p>' +
                '<p style="margin-top:12px;"><strong>Suggested Action:</strong> '+(c.aiSuggestedResponse || '<span style="color:var(--text-light)">Pending run</span>')+'</p>' +
                '<button class="btn btn-secondary btn-sm" style="margin-top:16px;" onclick="runAi()">Run Classification</button>' +
            '</div></div>' +
        '</div>';
    } else if (currentTab === 'actions') {
        contentHtml = 
        '<div class="grid-2">' +
            '<div class="card"><div class="card-header"><h3>Change Status</h3></div><div class="card-body">' +
                '<div class="form-group"><label>New Status</label><select id="new-status" class="form-control"><option value="OPEN" '+(c.status==='OPEN'?'selected':'')+'>Open</option><option value="IN_PROGRESS" '+(c.status==='IN_PROGRESS'?'selected':'')+'>In Progress</option><option value="RESOLVED" '+(c.status==='RESOLVED'?'selected':'')+'>Resolved</option><option value="ESCALATED" '+(c.status==='ESCALATED'?'selected':'')+'>Escalated</option><option value="CLOSED" '+(c.status==='CLOSED'?'selected':'')+'>Closed</option></select></div>' +
                '<div class="form-group"><label>Internal Note (Optional)</label><textarea id="status-note" class="form-control"></textarea></div>' +
                '<button class="btn btn-primary" onclick="updateStatus()">Update Status</button>' +
            '</div></div>' +
            '<div class="card"><div class="card-header"><h3>Assign Agent</h3></div><div class="card-body">' +
                '<div class="form-group"><label>Select Agent</label><select id="new-agent" class="form-control"><option value="">Loading agents...</option></select></div>' +
                '<button class="btn btn-secondary" onclick="assignAgent()">Reassign</button>' +
            '</div></div>' +
        '</div>';
        setTimeout(loadAgentsForDropdown, 0);
    } else if (currentTab === 'communication') {
        const commentsHtml = (c.comments || []).map(cm => 
            '<div class="timeline-item"><div class="timeline-marker"></div><div class="timeline-content">' +
            '<div class="timeline-header"><strong>'+cm.authorName+'</strong> ('+cm.authorRole+') <span>'+formatDate(cm.createdAt)+'</span>' + (cm.isInternal ? '<span class="badge badge-negative" style="margin-left:8px">Internal</span>' : '') + '</div>' +
            '<div class="timeline-body">'+cm.content+'</div></div></div>'
        ).join('') || '<p style="color:var(--text-sec);padding:20px 0;">No communication history.</p>';

        contentHtml = 
        '<div class="card"><div class="card-header"><h3>Timeline</h3></div><div class="card-body">' +
            '<div class="timeline">' + commentsHtml + '</div>' +
            '<div style="margin-top:24px;border-top:1px solid var(--border);padding-top:20px;">' +
                '<h4>Add Reply</h4>' +
                '<div class="form-group"><textarea id="reply-text" class="form-control" rows="3" placeholder="Type your message here..."></textarea></div>' +
                '<div style="display:flex; gap:12px; align-items:center;">' +
                    '<label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="reply-internal"> Internal Note Only</label>' +
                    '<button class="btn btn-primary" onclick="addReply()">Send</button>' +
                '</div>' +
            '</div>' +
        '</div></div>';
    } else if (currentTab === 'sla') {
        let pct = c.slaStatus ? c.slaStatus.elapsedPercent : 0;
        let barColor = pct > 100 ? 'var(--negative)' : (pct > 75 ? 'var(--critical)' : 'var(--positive)');
        
        contentHtml = 
        '<div class="card"><div class="card-header"><h3>SLA Monitor</h3></div><div class="card-body">' +
            '<ul class="info-list" style="margin-bottom:24px;">' +
                '<li class="info-row"><span class="info-label">Created At</span><span class="info-value">'+formatDate(c.createdAt)+'</span></li>' +
                '<li class="info-row"><span class="info-label">Target Resolution</span><span class="info-value" style="font-weight:700;">'+formatDate(c.slaDeadline)+'</span></li>' +
                '<li class="info-row"><span class="info-label">Current Status</span><span class="info-value">'+slaBadge(c.slaStatus)+'</span></li>' +
            '</ul>' +
            '<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;font-weight:600;"><span style="color:var(--text-sec)">Time Elapsed</span><span>'+Math.round(pct)+'%</span></div>' +
            '<div style="width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;"><div style="height:100%;background:'+barColor+';width:'+Math.min(pct, 100)+'%;"></div></div></div>' +
        '</div></div>';
    } else if (currentTab === 'customer') {
        let cust = c.customer;
        contentHtml = 
        '<div class="grid-2">' +
            '<div class="card"><div class="card-header"><h3>Profile Information</h3></div><div class="card-body">' +
                '<ul class="info-list">' +
                    '<li class="info-row"><span class="info-label">Customer #</span><span class="info-value">'+cust.customerNumber+'</span></li>' +
                    '<li class="info-row"><span class="info-label">Full Name</span><span class="info-value">'+cust.fullName+'</span></li>' +
                    '<li class="info-row"><span class="info-label">Email</span><span class="info-value">'+cust.email+'</span></li>' +
                    '<li class="info-row"><span class="info-label">Phone</span><span class="info-value">'+cust.phone+'</span></li>' +
                '</ul>' +
                '<button class="btn btn-secondary" style="margin-top:16px;width:100%" onclick="window.location.href=\'/customers.html\'">View Full Profile Record</button>' +
            '</div></div>' +
        '</div>';
    }

    el.innerHTML = 
        '<div class="object-header">' +
            '<div class="object-header-top">' +
                '<div class="object-title"><h1>'+c.title+'</h1><span style="color:var(--text-sec);font-size:18px;margin-left:8px;">'+c.ticketNumber+'</span></div>' +
                '<div class="object-actions">' +
                    '<button class="btn btn-primary" onclick="switchTab(\'actions\')">Manage Process</button>' +
                '</div>' +
            '</div>' +
            '<div class="object-attributes">' +
                '<div class="attr-item"><span class="attr-label">Status</span><span class="attr-value">'+statusBadge(c.status)+'</span></div>' +
                '<div class="attr-item"><span class="attr-label">Severity</span><span class="attr-value">'+severityBadge(c.severity)+'</span></div>' +
                '<div class="attr-item"><span class="attr-label">Product Area</span><span class="attr-value">'+productLabel(c.productType)+'</span></div>' +
                '<div class="attr-item"><span class="attr-label">Assigned To</span><span class="attr-value">'+(c.assignedAgent?c.assignedAgent.name:'—')+'</span></div>' +
                '<div class="attr-item"><span class="attr-label">Reported via</span><span class="attr-value">'+(c.channel||'—')+'</span></div>' +
            '</div>' +
        '</div>' +
        tabsHtml +
        '<div class="page-body">' + contentHtml + '</div>';
}

function switchTab(t) { currentTab = t; render(); }

async function loadAgentsForDropdown() {
    let sel = document.getElementById('new-agent');
    if (!sel) return;
    try {
        let res = await api.getAgents();
        sel.innerHTML = '<option value="">Select Agent...</option>' + res.map(a => '<option value="'+a.id+'">'+a.name+' ('+a.role+')</option>').join('');
    } catch(e) { sel.innerHTML = '<option value="">Error loading</option>'; }
}

async function updateStatus() {
    let s = document.getElementById('new-status').value;
    let n = document.getElementById('status-note').value;
    try {
        complaint = await api.updateStatus(compId, s, n);
        showToast('Status updated');
        render();
    } catch(e) { showToast(e.message, 'error'); }
}

async function assignAgent() {
    let aid = document.getElementById('new-agent').value;
    if(!aid) return showToast('Select an agent', 'error');
    try {
        complaint = await api.assignAgent(compId, aid);
        showToast('Agent assigned');
        render();
    } catch(e) { showToast(e.message, 'error'); }
}

async function addReply() {
    let txt = document.getElementById('reply-text').value;
    let internal = document.getElementById('reply-internal').checked;
    if(!txt.trim()) return;
    try {
        await api.addComment(compId, txt, 'A. Supervisor', 'SUPERVISOR', internal);
        document.getElementById('reply-text').value = '';
        complaint = await api.getComplaint(compId); // Reload to get new comment
        render();
        showToast('Reply added');
    } catch(e) { showToast(e.message, 'error'); }
}

async function runAi() {
    showToast('Running AI Analysis...');
    try {
        complaint = await api.classifyComplaint(compId);
        showToast('Analysis complete', 'success');
        render();
    } catch(e) { showToast(e.message, 'error'); }
}

loadDetail();
</script>
</body>
</html>
