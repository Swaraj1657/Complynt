<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints — ComplaintHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
    <div class="page-header">
        <div class="page-header-left"><h1>Complaints</h1><p>Browse, filter, and manage all complaints</p></div>
    </div>
    <div class="page-body">
        <div class="card">
            <div class="filter-toolbar">
                <span class="filter-label">Filters:</span>
                <select id="f-status" onchange="loadList()">
                    <option value="">All Status</option><option value="OPEN">Open</option><option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option><option value="ESCALATED">Escalated</option><option value="CLOSED">Closed</option>
                </select>
                <select id="f-product" onchange="loadList()">
                    <option value="">All Products</option><option value="CREDIT_CARD">Credit Card</option><option value="HOME_LOAN">Home Loan</option>
                    <option value="SAVINGS_ACCOUNT">Savings Account</option><option value="FIXED_DEPOSIT">Fixed Deposit</option>
                    <option value="INSURANCE">Insurance</option><option value="PERSONAL_LOAN">Personal Loan</option><option value="OTHER">Other</option>
                </select>
                <select id="f-severity" onchange="loadList()">
                    <option value="">All Severity</option><option value="P1">P1 Critical</option><option value="P2">P2 High</option>
                    <option value="P3">P3 Medium</option><option value="P4">P4 Low</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table"><thead><tr>
                    <th>Ticket #</th><th>Title</th><th>Customer</th><th>Product</th><th>Severity</th><th>Status</th><th>SLA</th><th>Agent</th><th>Created</th>
                </tr></thead><tbody id="tbody"><tr><td colspan="9"><div class="loading"><div class="spinner"></div>Loading...</div></td></tr></tbody></table>
            </div>
            <div id="paging" class="pagination"></div>
        </div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
initLayout('complaints');
var curPage = 0;
function clearFilters() { document.getElementById('f-status').value=''; document.getElementById('f-product').value=''; document.getElementById('f-severity').value=''; loadList(); }
async function loadList(page) {
    curPage = page || 0;
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '<tr><td colspan="9"><div class="loading"><div class="spinner"></div>Loading...</div></td></tr>';
    try {
        var data = await api.getComplaints({ page: curPage, size: 15,
            status: document.getElementById('f-status').value,
            productType: document.getElementById('f-product').value,
            severity: document.getElementById('f-severity').value });
        var list = data.content || [];
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-sec);">No complaints found</td></tr>';
        } else {
            tbody.innerHTML = list.map(function(c) {
                return '<tr onclick="window.location.href=\'/complaint-detail.html?id='+c.id+'\'">' +
                    '<td><span class="ticket-link">'+(c.ticketNumber||'\u2014')+'</span></td>' +
                    '<td>'+(c.title||'\u2014')+'</td>' +
                    '<td>'+(c.customer?c.customer.fullName:'\u2014')+'</td>' +
                    '<td style="font-size:12px;">'+productLabel(c.productType)+'</td>' +
                    '<td>'+severityBadge(c.severity)+'</td>' +
                    '<td>'+statusBadge(c.status)+'</td>' +
                    '<td>'+slaBadge(c.slaStatus)+'</td>' +
                    '<td>'+(c.assignedAgent?c.assignedAgent.name:'<em style="color:var(--text-light)">Unassigned</em>')+'</td>' +
                    '<td style="font-size:12px;color:var(--text-sec);">'+formatDateShort(c.createdAt)+'</td></tr>';
            }).join('');
        }
        var tp = data.totalPages || 0;
        var pg = document.getElementById('paging');
        if (tp <= 1) { pg.innerHTML = ''; return; }
        pg.innerHTML = '<button '+(curPage===0?'disabled':'')+' onclick="loadList('+(curPage-1)+')">Prev</button>' +
            '<span>Page '+(curPage+1)+' of '+tp+'</span>' +
            '<button '+(curPage>=tp-1?'disabled':'')+' onclick="loadList('+(curPage+1)+')">Next</button>';
    } catch (err) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><p>Error: '+err.message+'</p></div></td></tr>'; }
}
loadList();
</script>
</body>
</html>
