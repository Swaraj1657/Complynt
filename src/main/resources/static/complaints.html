<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints — Complynt</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Shell Bar injected by common.js -->
    <div id="shell-bar"></div>

    <!-- Left Nav injected by common.js -->
    <nav id="left-nav-container"></nav>

    <!-- Main Content -->
    <main class="app-layout" id="main-content">
        <div class="page-header">
            <div class="page-header__left">
                <h1 class="page-header__title">Complaints</h1>
                <p class="page-header__subtitle">Browse, filter, and manage all complaints</p>
            </div>
            <div class="page-header__actions">
                <button class="btn btn-ghost" onclick="exportCurrentView()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export CSV
                </button>
                <a href="/new-complaint.html" target="_blank" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New Complaint
                </a>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="card mb-24">
            <div class="filter-bar">
                <input type="text" class="filter-input" id="search-input" placeholder="Search by ID, customer, keyword..." onkeyup="handleSearchKeyup(event)">
                <select class="filter-select" id="filter-status" onchange="applyFilters()">
                    <option value="">All Status</option>
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="ESCALATED">Escalated</option>
                    <option value="CLOSED">Closed</option>
                </select>
                <select class="filter-select" id="filter-product" onchange="applyFilters()">
                    <option value="">All Products</option>
                    <option value="CREDIT_CARD">Credit Card</option>
                    <option value="HOME_LOAN">Home Loan</option>
                    <option value="SAVINGS_ACCOUNT">Savings Account</option>
                    <option value="FIXED_DEPOSIT">Fixed Deposit</option>
                    <option value="INSURANCE">Insurance</option>
                    <option value="PERSONAL_LOAN">Personal Loan</option>
                    <option value="OTHER">Other</option>
                </select>
                <select class="filter-select" id="filter-severity" onchange="applyFilters()">
                    <option value="">All Severity</option>
                    <option value="P1">P1 Critical</option>
                    <option value="P2">P2 High</option>
                    <option value="P3">P3 Medium</option>
                    <option value="P4">P4 Low</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Reset</button>
            </div>

            <!-- Active Filter Tags -->
            <div class="filter-tags" id="active-filter-tags"></div>

            <!-- Data Table -->
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th onclick="sortBy('ticketNumber')">Ticket #</th>
                            <th onclick="sortBy('title')">Title</th>
                            <th onclick="sortBy('customer')">Customer</th>
                            <th onclick="sortBy('productType')">Product</th>
                            <th onclick="sortBy('severity')">Severity</th>
                            <th onclick="sortBy('status')">Status</th>
                            <th>SLA</th>
                            <th onclick="sortBy('agent')">Agent</th>
                            <th onclick="sortBy('createdAt')">Created</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-tbody">
                        <tr><td colspan="9"><div class="loading"><div class="spinner"></div>Loading complaints...</div></td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // Initialize layout
        initLayout('complaints');

        // State
        let currentPage = 0;
        let currentSort = { field: 'createdAt', dir: 'desc' };
        let currentData = [];

        // Read URL params for initial filters
        function initFromURL() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('status')) {
                document.getElementById('filter-status').value = params.get('status');
            }
            if (params.get('productType')) {
                document.getElementById('filter-product').value = params.get('productType');
            }
            if (params.get('severity')) {
                document.getElementById('filter-severity').value = params.get('severity');
            }
        }

        async function loadComplaints(page = 0) {
            currentPage = page;
            const tbody = document.getElementById('complaints-tbody');
            
            // Show skeleton
            showTableSkeleton('complaints-tbody', 9, 8);

            try {
                const filters = {
                    page: currentPage,
                    size: 15,
                    status: document.getElementById('filter-status').value,
                    productType: document.getElementById('filter-product').value,
                    severity: document.getElementById('filter-severity').value
                };

                const data = await getComplaints(filters);
                currentData = data.content || [];

                if (!currentData.length) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9">
                                <div class="empty-state">
                                    <p class="empty-text">No complaints found</p>
                                    <p class="empty-sub">Try adjusting your filters or create a new complaint</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    document.getElementById('pagination').innerHTML = '';
                    return;
                }

                renderTable(currentData);
                renderPagination(data.totalPages || 1);
                renderFilterTags();

            } catch (err) {
                showToast('Failed to load complaints: ' + err.message, 'error');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9">
                            <div class="empty-state">
                                <p class="empty-text">Error loading complaints</p>
                                <p class="empty-sub">${err.message}</p>
                                <button class="btn btn-primary mt-16" onclick="loadComplaints()">Retry</button>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }

        function renderTable(complaints) {
            const tbody = document.getElementById('complaints-tbody');
            tbody.innerHTML = complaints.map(c => `
                <tr onclick="viewComplaint(${c.id})">
                    <td><span class="id-cell">${c.ticketNumber || '\u2014'}</span></td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${c.title || ''}">${c.title || '\u2014'}</td>
                    <td>${c.customer ? c.customer.fullName : '\u2014'}</td>
                    <td style="font-size: 12px;">${productLabel(c.productType)}</td>
                    <td>${severityBadge(c.severity)}</td>
                    <td>${statusBadge(c.status)}</td>
                    <td>${slaBadge(c.slaStatus)}</td>
                    <td>${c.assignedAgent ? c.assignedAgent.name : '<span style="color: var(--color-text-light); font-style: italic;">Unassigned</span>'}</td>
                    <td class="mono" style="font-size: 12px; color: var(--color-text-muted);">${formatDateShort(c.createdAt)}</td>
                </tr>
            `).join('');
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button class="pagination-btn" onclick="loadComplaints(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
            `;

            for (let i = 0; i < totalPages; i++) {
                if (i === 0 || i === totalPages - 1 || Math.abs(i - currentPage) <= 1) {
                    html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="loadComplaints(${i})">${i + 1}</button>`;
                } else if (Math.abs(i - currentPage) === 2) {
                    html += '<span class="pagination-info">...</span>';
                }
            }

            html += `
                <button class="pagination-btn" onclick="loadComplaints(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            `;

            pagination.innerHTML = html;
        }

        function renderFilterTags() {
            const container = document.getElementById('active-filter-tags');
            const tags = [];

            const status = document.getElementById('filter-status').value;
            const product = document.getElementById('filter-product').value;
            const severity = document.getElementById('filter-severity').value;

            if (status) tags.push({ label: 'Status: ' + status.replace(/_/g, ' '), field: 'status' });
            if (product) tags.push({ label: 'Product: ' + productLabel(product), field: 'product' });
            if (severity) tags.push({ label: 'Severity: ' + severity, field: 'severity' });

            if (!tags.length) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = tags.map(tag => `
                <span class="filter-tag">
                    ${tag.label}
                    <span class="filter-tag__remove" onclick="clearFilter('${tag.field}')">&times;</span>
                </span>
            `).join('');
        }

        function clearFilter(field) {
            if (field === 'status') document.getElementById('filter-status').value = '';
            if (field === 'product') document.getElementById('filter-product').value = '';
            if (field === 'severity') document.getElementById('filter-severity').value = '';
            applyFilters();
        }

        function applyFilters() {
            loadComplaints(0);
        }

        function resetFilters() {
            document.getElementById('filter-status').value = '';
            document.getElementById('filter-product').value = '';
            document.getElementById('filter-severity').value = '';
            document.getElementById('search-input').value = '';
            loadComplaints(0);
        }

        function handleSearchKeyup(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        }

        function sortBy(field) {
            // Toggle sort direction
            if (currentSort.field === field) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = field;
                currentSort.dir = 'asc';
            }
            loadComplaints(currentPage);
        }

        function viewComplaint(id) {
            window.location.href = '/complaint-detail.html?id=' + id;
        }

        function exportCurrentView() {
            if (!currentData.length) {
                showToast('No data to export', 'warning');
                return;
            }

            const exportData = currentData.map(c => ({
                'Ticket #': c.ticketNumber,
                'Title': c.title,
                'Customer': c.customer ? c.customer.fullName : '',
                'Product': productLabel(c.productType),
                'Severity': c.severity,
                'Status': c.status,
                'SLA Status': c.slaStatus ? c.slaStatus.status : 'N/A',
                'Agent': c.assignedAgent ? c.assignedAgent.name : 'Unassigned',
                'Created': c.createdAt
            }));

            exportToCSV(exportData, 'complaints-export.csv');
        }

        // Initialize
        initFromURL();
        loadComplaints();
    </script>
</body>
</html>
