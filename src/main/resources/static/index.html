<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — ComplaintHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
    <div class="page-header">
        <div class="page-header-left">
            <h1>Dashboard</h1>
            <p>Real-time overview of complaint operations</p>
        </div>
    </div>
    <div class="page-body" id="dashboard-body">
        <div class="loading"><div class="spinner"></div>Loading dashboard...</div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
initLayout('dashboard');

async function loadDashboard() {
    var el = document.getElementById('dashboard-body');
    try {
        var results = await Promise.all([api.getSummary(), api.getTrend(7)]);
        var summary = results[0], trend = results[1];

        el.innerHTML =
        '<div class="tile-grid">' +
            '<div class="tile tile-info"><div class="tile-label">Total Complaints</div><div class="tile-value">' + summary.totalComplaints + '</div><div class="tile-sub">All time</div></div>' +
            '<div class="tile tile-critical"><div class="tile-label">Open</div><div class="tile-value">' + summary.openCount + '</div><div class="tile-sub">Awaiting action</div></div>' +
            '<div class="tile" style="border-top-color:#f59e0b;color:#f59e0b;"><div class="tile-label">In Progress</div><div class="tile-value">' + summary.inProgressCount + '</div><div class="tile-sub">Being resolved</div></div>' +
            '<div class="tile tile-positive"><div class="tile-label">Resolved</div><div class="tile-value">' + summary.resolvedCount + '</div><div class="tile-sub">Completed</div></div>' +
            '<div class="tile tile-purple"><div class="tile-label">Escalated</div><div class="tile-value">' + summary.escalatedCount + '</div><div class="tile-sub">Needs attention</div></div>' +
            '<div class="tile tile-negative"><div class="tile-label">SLA Breached</div><div class="tile-value">' + summary.breachedSlaCount + '</div><div class="tile-sub">Overdue</div></div>' +
        '</div>' +

        '<div class="grid-2 mb-24">' +
            '<div class="card"><div class="card-header"><h3>Complaints by Product</h3></div><div class="card-body"><div class="bar-chart" id="chart-product"></div></div></div>' +
            '<div class="card"><div class="card-header"><h3>Complaints by Severity</h3></div><div class="card-body"><div class="bar-chart" id="chart-severity"></div></div></div>' +
        '</div>' +

        '<div class="card mb-24"><div class="card-header"><h3>Daily Trend \u2014 Last 7 Days</h3></div><div class="card-body"><div class="bar-chart" id="chart-trend" style="height:180px;"></div></div></div>' +

        '<div class="card mb-24"><div class="card-header"><h3>Status Distribution</h3></div><div class="card-body"><div class="bar-chart" id="chart-status"></div></div></div>' +

        '<div class="grid-2">' +
            '<a href="/complaints" class="card" style="text-decoration:none;"><div class="card-body" style="text-align:center;padding:32px;"><h3 style="color:var(--text);font-size:16px;">View All Complaints</h3><p style="color:var(--text-sec);font-size:12px;margin-top:4px;">Browse, filter, and manage</p></div></a>' +
            '<a href="/sla" class="card" style="text-decoration:none;"><div class="card-body" style="text-align:center;padding:32px;"><h3 style="color:var(--text);font-size:16px;">SLA Monitor</h3><p style="color:var(--text-sec);font-size:12px;margin-top:4px;">Track breaches and at-risk</p></div></a>' +
        '</div>';

        renderBarChart('chart-product', summary.byProduct || {}, ['#0070f2','#107e3e','#e9730c','#bb0000','#7c3aed','#0891b2','#6c757d']);
        renderBarChart('chart-severity', summary.bySeverity || {}, ['#bb0000','#e9730c','#0070f2','#6c757d']);
        renderBarChart('chart-status', summary.byStatus || {}, ['#0070f2','#e9730c','#107e3e','#7c3aed','#6c757d']);

        if (trend && trend.length) {
            var td = {}; trend.forEach(function(t) { td[t.date] = t.count; });
            renderBarChart('chart-trend', td, ['#0070f2']);
        } else {
            document.getElementById('chart-trend').innerHTML = '<div class="empty-state"><p class="empty-text">No trend data yet. Create complaints to see trends.</p></div>';
        }
    } catch (err) {
        el.innerHTML = '<div class="empty-state"><p class="empty-text">Could not load dashboard</p><p class="empty-sub">' + err.message + '</p></div>';
    }
}
loadDashboard();
</script>
</body>
</html>
