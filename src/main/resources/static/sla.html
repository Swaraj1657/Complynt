<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA Monitor — ComplaintHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
    <div class="page-header">
        <div class="page-header-left"><h1>SLA Monitor</h1><p>Track SLA breaches, at-risk complaints, and escalation rules</p></div>
    </div>
    <div class="page-body" id="sla-body">
        <div class="loading"><div class="spinner"></div>Loading SLA data...</div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
initLayout('sla');

async function loadSla() {
    const el = document.getElementById('sla-body');
    try {
        const [breached, rules] = await Promise.all([api.getBreached(), api.getSlaRules()]);

        el.innerHTML = `
        <div class="tile-grid mb-24">
            <div class="tile tile-negative">
                <div class="tile-label">SLA Breached</div>
                <div class="tile-value">${breached.length}</div>
                <div class="tile-sub">Overdue complaints</div>
            </div>
        </div>

        <!-- Breached Complaints -->
        <div class="card mb-24">
            <div class="card-header"><h3>Breached & At-Risk Complaints</h3></div>
            ${breached.length ? '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Ticket</th><th>Title</th><th>Severity</th><th>Status</th><th>SLA</th><th>Created</th></tr></thead><tbody>' +
            breached.map(c => '<tr onclick="location.href=\'/complaint-detail.html?id='+c.id+'\'" style="cursor:pointer">' +
                '<td class="ticket-link">'+(c.ticketNumber||'—')+'</td>' +
                '<td>'+c.title+'</td>' +
                '<td>'+severityBadge(c.severity)+'</td>' +
                '<td>'+statusBadge(c.status)+'</td>' +
                '<td>'+slaBadge(c.slaStatus)+'</td>' +
                '<td style="font-size:12px">'+formatDateShort(c.createdAt)+'</td></tr>').join('') +
            '</tbody></table></div>' :
            '<div class="card-body"><div class="empty-state"><p class="empty-text">No SLA breaches! All complaints are on track.</p></div></div>'}
        </div>

        <!-- SLA Rules -->
        <div class="card">
            <div class="card-header"><h3>SLA Configuration Rules</h3></div>
            <div style="overflow-x:auto">
                <table class="data-table">
                    <thead><tr><th>Rule ID</th><th>Severity Trigger</th><th>SLA Hours</th><th>Warning %</th><th>Product Area</th></tr></thead>
                    <tbody>
                        ${rules.map(r => '<tr><td>Rule #'+r.id+'</td><td><span class="badge badge-'+(r.severity||'').toLowerCase()+'">'+(r.severity||'—')+'</span></td><td style="font-weight:700">'+r.slaHours+' hrs</td><td>'+r.warnAtPercent+'%</td><td>'+(r.productType?productLabel(r.productType):'<span style="color:var(--text-light)">Global (All Products)</span>')+'</td></tr>').join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    } catch(err) {
        el.innerHTML = '<div class="empty-state"><p>Error: '+err.message+'</p></div>';
    }
}
loadSla();
</script>
</body>
</html>
