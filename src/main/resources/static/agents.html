<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agents — ComplaintHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main">
    <div class="page-header">
        <div class="page-header-left"><h1>Agent Directory</h1><p>Manage agent teams and workloads</p></div>
    </div>
    <div class="page-body" id="agents-body">
        <div class="loading"><div class="spinner"></div>Loading agents...</div>
    </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
initLayout('agents');

async function loadAgents() {
    const el = document.getElementById('agents-body');
    try {
        const res = await api.getAgents();
        
        el.innerHTML = 
        '<div class="tile-grid mb-24">' +
            '<div class="tile tile-info"><div class="tile-label">Total Agents</div><div class="tile-value">'+res.length+'</div><div class="tile-sub">Active personnel</div></div>' +
        '</div>' +
        '<div class="card"><div class="card-header"><h3>Agent Personnel</h3></div>' +
        '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>Agent ID</th><th>Name</th><th>Role</th><th>Email Address</th><th>Status</th><th>Workload</th></tr></thead><tbody>' +
        res.map(a => '<tr><td><strong>AGT-'+a.id.toString().padStart(4,'0')+'</strong></td>' +
            '<td><div style="display:flex;align-items:center;gap:12px;"><div style="width:28px;height:28px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">'+a.name.charAt(0)+'</div>'+a.name+'</div></td>' +
            '<td>'+a.role+'</td><td>'+a.email+'</td>' +
            '<td><span class="badge badge-positive">Active</span></td>' +
            '<td><a href="/complaints.html" style="color:var(--primary);text-decoration:none;font-size:13px;font-weight:600;">View Queue →</a></td></tr>').join('') +
        '</tbody></table></div></div>';
    } catch(err) {
        el.innerHTML = '<div class="empty-state"><p>Error: '+err.message+'</p></div>';
    }
}

loadAgents();
</script>
</body>
</html>
